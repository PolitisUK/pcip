name: Deploy PCIP to Azure
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Azure environment name
        required: true
        default: dev
      image_tag:
        description: Container image tag
        required: true
        default: 0.6.0
permissions:
  id-token: write
  contents: read
jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Azure resources
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            prefix=${{ vars.PCIP_PREFIX }}
            environmentName=${{ inputs.environment }}
            containerImageTag=${{ inputs.image_tag }}
            postgresAdminUser=${{ vars.POSTGRES_ADMIN_USER }}
            postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
            secretKey=${{ secrets.PCIP_SECRET_KEY }}
            defenderWebhookSecret=${{ secrets.DEFENDER_WEBHOOK_SECRET }}
            entraTenantId=${{ vars.ENTRA_TENANT_ID }}
            entraClientId=${{ vars.ENTRA_CLIENT_ID }}
            entraClientSecret=${{ secrets.ENTRA_CLIENT_SECRET }}
            entraAllowedDomains=${{ vars.ENTRA_ALLOWED_DOMAINS }}
            entraDefaultOrganisationSlug=${{ vars.ENTRA_DEFAULT_ORGANISATION_SLUG }}
          deploymentName: pcip-${{ inputs.environment }}-${{ github.run_number }}
      - name: Resolve deployment resources
        id: resources
        shell: bash
        run: |
          APP="${{ vars.AZURE_WEBAPP_NAME }}"
          if [ -z "$APP" ] && [ "${{ inputs.environment }}" = "production" ]; then
            APP="citizencentric-pcip-prod"
          fi
          if [ -z "$APP" ]; then
            APP=$(az deployment group show \
              -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
              -n "pcip-${{ inputs.environment }}-${{ github.run_number }}" \
              --query "properties.outputs.appName.value" \
              -o tsv)
          fi
          az webapp show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$APP" --output none

          LIVE_IMAGE=$(az webapp config show \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "$APP" \
            --query linuxFxVersion \
            -o tsv)
          REGISTRY_HOST="${LIVE_IMAGE#DOCKER|}"
          REGISTRY_HOST="${REGISTRY_HOST%%/*}"
          ACR="${REGISTRY_HOST%%.*}"
          if [ -z "$ACR" ] || [ "$ACR" = "$REGISTRY_HOST" ]; then
            echo "Unable to resolve the Azure Container Registry from $APP." >&2
            exit 1
          fi
          az acr show -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "$ACR" --output none
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
      - name: Build image in Azure Container Registry
        run: az acr build --registry "${{ steps.resources.outputs.acr }}" --image "pcip:${{ inputs.image_tag }}" .
      - name: Configure application container startup
        shell: bash
        run: |
          az webapp config appsettings set \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.resources.outputs.app }}" \
            --settings RUN_MIGRATIONS=true \
            --output none
          az webapp config set \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.resources.outputs.app }}" \
            --linux-fx-version "DOCKER|${{ steps.resources.outputs.acr }}.azurecr.io/pcip:${{ inputs.image_tag }}" \
            --startup-file "" \
            --output none
      - name: Restart application
        run: az webapp restart -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ steps.resources.outputs.app }}"
      - name: Verify application readiness
        shell: bash
        run: |
          APP_HOST=$(az webapp show \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.resources.outputs.app }}" \
            --query defaultHostName \
            -o tsv)
          for attempt in {1..30}; do
            if curl --fail --silent --show-error \
              "https://${APP_HOST}/health/ready" \
              | grep -q '"status":"ready"'; then
              exit 0
            fi
            sleep 10
          done
          echo "Application did not become ready within five minutes." >&2
          exit 1
