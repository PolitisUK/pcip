name: PCIP staging application deployment
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Must be staging. Production promotion uses Promote PCIP release candidate.
        required: true
        default: staging
      image_tag:
        description: Container image tag
        required: true
        default: 0.6.0
      seed_rivermere_demo:
        description: Run and verify the idempotent Rivermere v1.1 import in the staging application container
        required: true
        type: boolean
        default: false
permissions:
  id-token: write
  contents: read
jobs:
  prevent-production-use:
    runs-on: ubuntu-latest
    steps:
      - name: Block the legacy production path
        shell: bash
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          environment_name=$(printf '%s' "$REQUESTED_ENVIRONMENT" | tr '[:upper:]' '[:lower:]')
          if [ "$environment_name" != "staging" ]; then
            echo "This workflow deploys only the explicitly configured staging application. Production promotion must use the digest-pinned Promote PCIP release candidate workflow." >&2
            exit 1
          fi

  test-and-deploy:
    needs: prevent-production-use
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve and validate the explicit staging target
        id: resources
        shell: bash
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.PCIP_STAGING_APP }}
          ACR: ${{ vars.PCIP_STAGING_ACR }}
        run: |
          set -euo pipefail

          for value in RG APP ACR; do
            test -n "${!value}" || { echo "Required staging repository variable $value is not configured." >&2; exit 1; }
          done
          az webapp show -g "$RG" -n "$APP" --query state -o tsv | grep -qx Running
          ACR_LOGIN_SERVER=$(az acr show -g "$RG" -n "$ACR" --query loginServer -o tsv)
          test -n "$ACR_LOGIN_SERVER" || { echo "Could not resolve the configured staging registry." >&2; exit 1; }
          LINUX_FX_VERSION=$(az webapp config show -g "$RG" -n "$APP" --query linuxFxVersion -o tsv)
          CURRENT_IMAGE=${LINUX_FX_VERSION#DOCKER|}
          CURRENT_IMAGE_SERVER=${CURRENT_IMAGE%%/*}
          IMAGE_REFERENCE=${CURRENT_IMAGE#*/}
          IMAGE_REPOSITORY=${IMAGE_REFERENCE%%@*}
          IMAGE_REPOSITORY=${IMAGE_REPOSITORY%%:*}

          if [ "$CURRENT_IMAGE_SERVER" != "$ACR_LOGIN_SERVER" ] || [ -z "$IMAGE_REPOSITORY" ]; then
            echo "The configured staging app does not use the configured staging registry." >&2
            exit 1
          fi

          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "acr=$ACR" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> "$GITHUB_OUTPUT"
          echo "image_repository=$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"
      - name: Build image in the explicit staging registry
        shell: bash
        run: |
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DEPLOY_TAG="${{ inputs.image_tag }}-${{ github.run_number }}"
          az acr build \
            --registry "${{ steps.resources.outputs.acr }}" \
            --build-arg "VCS_REF=${{ github.sha }}" \
            --build-arg "BUILD_CREATED=$created" \
            --image "${{ steps.resources.outputs.image_repository }}:${DEPLOY_TAG}" \
            .
      - name: Point the explicit staging application at the new image
        shell: bash
        run: |
          DEPLOY_TAG="${{ inputs.image_tag }}-${{ github.run_number }}"
          az webapp config set \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.resources.outputs.app }}" \
            --linux-fx-version "DOCKER|${{ steps.resources.outputs.acr_login_server }}/${{ steps.resources.outputs.image_repository }}:${DEPLOY_TAG}"
      - name: Enable the staging-only Rivermere startup runner
        if: ${{ inputs.seed_rivermere_demo }}
        run: >-
          az webapp config appsettings set
          -g "${{ vars.AZURE_RESOURCE_GROUP }}"
          -n "${{ steps.resources.outputs.app }}"
          --settings RUN_RIVERMERE_DEMO_SEED=true
      - name: Enable container diagnostics
        continue-on-error: true
        run: >-
          az webapp log config
          -g "${{ vars.AZURE_RESOURCE_GROUP }}"
          -n "${{ steps.resources.outputs.app }}"
          --docker-container-logging filesystem
      - name: Restart application
        run: az webapp restart -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ steps.resources.outputs.app }}"
      - name: Verify sustained application readiness
        shell: bash
        run: |
          APP_HOST=$(az webapp show \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.resources.outputs.app }}" \
            --query defaultHostName \
            -o tsv)

          ready=0
          for attempt in {1..24}; do
            body=$(curl --fail --silent --show-error "https://${APP_HOST}/health/ready" 2>/tmp/pcip-curl-error || true)
            if printf '%s' "$body" | grep -q '"status":"ready"'; then
              ready=1
              echo "Initial readiness passed on attempt $attempt."
              break
            fi
            echo "Waiting for readiness ($attempt/24)..."
            cat /tmp/pcip-curl-error || true
            sleep 10
          done

          if [ "$ready" -ne 1 ]; then
            echo "Application never became ready within four minutes." >&2
            exit 1
          fi

          echo "Verifying the app remains healthy for one minute..."
          for stable_check in {1..6}; do
            sleep 10
            body=$(curl --fail --silent --show-error "https://${APP_HOST}/health/ready" 2>/tmp/pcip-curl-error || true)
            if ! printf '%s' "$body" | grep -q '"status":"ready"'; then
              echo "Application became unhealthy during stability check $stable_check/6." >&2
              cat /tmp/pcip-curl-error >&2 || true
              exit 1
            fi
            echo "Stable readiness check $stable_check/6 passed."
          done
      - name: Clear the staging-only Rivermere startup runner
        if: ${{ always() && inputs.seed_rivermere_demo }}
        run: >-
          az webapp config appsettings set
          -g "${{ vars.AZURE_RESOURCE_GROUP }}"
          -n "${{ steps.resources.outputs.app }}"
          --settings RUN_RIVERMERE_DEMO_SEED=false
      - name: Restart after clearing the Rivermere startup runner
        if: ${{ success() && inputs.seed_rivermere_demo }}
        run: az webapp restart -g "${{ vars.AZURE_RESOURCE_GROUP }}" -n "${{ steps.resources.outputs.app }}"
      - name: Verify readiness after clearing the Rivermere startup runner
        if: ${{ success() && inputs.seed_rivermere_demo }}
        shell: bash
        run: |
          APP_HOST=$(az webapp show \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.resources.outputs.app }}" \
            --query defaultHostName \
            -o tsv)
          for attempt in {1..24}; do
            body=$(curl --fail --silent --show-error "https://${APP_HOST}/health/ready" || true)
            if printf '%s' "$body" | grep -q '"status":"ready"'; then
              echo "Readiness passed after the staging seed flag was cleared."
              exit 0
            fi
            echo "Waiting for readiness after clearing the seed flag ($attempt/24)..."
            sleep 10
          done
          echo "Application did not recover after the staging seed flag was cleared." >&2
          exit 1
      - name: Refresh Azure login for diagnostics
        if: ${{ failure() }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Capture failed container startup logs
        if: ${{ failure() }}
        shell: bash
        continue-on-error: true
        run: |
          echo "===== Azure diagnostics ====="
          rm -rf /tmp/pcip-app-logs /tmp/pcip-app-logs.zip
          mkdir -p /tmp/pcip-app-logs
          az webapp log download \
            -g "${{ vars.AZURE_RESOURCE_GROUP }}" \
            -n "${{ steps.resources.outputs.app }}" \
            --log-file /tmp/pcip-app-logs.zip || true
          if [ -f /tmp/pcip-app-logs.zip ]; then
            unzip -oq /tmp/pcip-app-logs.zip -d /tmp/pcip-app-logs || true
            find /tmp/pcip-app-logs -type f -print
            echo "===== Matching errors ====="
            grep -RniE "Traceback|RuntimeError|ERROR|CRITICAL|Exception|migration|database|storage|credential|permission|denied|failed" /tmp/pcip-app-logs 2>/dev/null | tail -n 300 || true
            echo "===== Recent log tails ====="
            find /tmp/pcip-app-logs -type f -print0 | while IFS= read -r -d '' file; do
              echo "--- $file ---"
              tail -n 120 "$file" || true
            done
          else
            echo "Azure did not return a downloadable log archive."
          fi
