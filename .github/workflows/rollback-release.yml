name: Roll back PCIP production release

on:
  workflow_dispatch:
    inputs:
      rollback_digest:
        description: Immutable sha256 digest of the previously verified production image.
        required: true
        type: string
      release_operator:
        description: Named operator performing the rollback.
        required: true
        type: string
      rollback_decision_owner:
        description: Named person or role that authorised the rollback.
        required: true
        type: string
      incident_or_change_reference:
        description: Incident or change record for the rollback decision.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  rollback-application:
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pcip-production-control
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PRODUCTION_APP: ${{ vars.PCIP_PRODUCTION_APP }}
      PRODUCTION_ACR: ${{ vars.PCIP_PRODUCTION_ACR }}
      IMAGE_REPOSITORY: pcip
      ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
      # Absent/false keeps rollback compatible until the isolated operations
      # infrastructure is deliberately provisioned.  Once enabled, rollback
      # cannot complete with a worker on a different image than App Service.
      PRODUCTION_OPERATIONS_ENABLED: ${{ vars.PCIP_PRODUCTION_OPERATIONS_ENABLED }}
      OPERATIONS_JOB: ${{ vars.PCIP_PRODUCTION_OPERATIONS_JOB }}
      OPERATIONS_WORKER_IDENTITY: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_IDENTITY }}
      OPERATIONS_WORKER_DIGEST: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_DIGEST }}
      OPERATIONS_WORKER_REVISION: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_REVISION }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore the verified application artifact
        shell: bash
        run: |
          set -euo pipefail
          for value in AZURE_RESOURCE_GROUP PRODUCTION_APP PRODUCTION_ACR; do
            test -n "${!value}" || { echo "Repository variable $value must be configured." >&2; exit 1; }
          done
          [[ "$ROLLBACK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "A digest, not a mutable tag, is required." >&2; exit 1; }
          az acr manifest show-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY@$ROLLBACK_DIGEST" --query digest -o tsv | grep -qx "$ROLLBACK_DIGEST"
          az webapp config appsettings set -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --settings RUN_MIGRATIONS=false >/dev/null
          az webapp config set -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --linux-fx-version "DOCKER|$PRODUCTION_ACR.azurecr.io/$IMAGE_REPOSITORY@$ROLLBACK_DIGEST" >/dev/null
          az webapp restart -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP"
      - name: Verify the independently pinned production-operations worker
        shell: bash
        run: |
          set -euo pipefail
          case "${PRODUCTION_OPERATIONS_ENABLED:-false}" in
            ''|false)
              echo "Production operations infrastructure is disabled; worker artifact verification skipped."
              exit 0
              ;;
            true)
              ;;
            *)
              echo "PCIP_PRODUCTION_OPERATIONS_ENABLED must be true or false." >&2
              exit 1
              ;;
          esac
          for value in AZURE_RESOURCE_GROUP PRODUCTION_ACR OPERATIONS_JOB OPERATIONS_WORKER_IDENTITY OPERATIONS_WORKER_DIGEST OPERATIONS_WORKER_REVISION; do
            test -n "${!value}" || { echo "$value is required when production operations are enabled." >&2; exit 1; }
          done
          [[ "$OPERATIONS_WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Operations worker image must be an immutable sha256 digest." >&2; exit 1; }
          [[ "$OPERATIONS_WORKER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Operations worker provenance revision is invalid." >&2; exit 1; }
          az acr manifest show-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY@$OPERATIONS_WORKER_DIGEST" --query digest -o tsv | grep -qx "$OPERATIONS_WORKER_DIGEST"
          az acr manifest list-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY" --query "[?digest=='$OPERATIONS_WORKER_DIGEST' && tags && contains(tags, 'sha-$OPERATIONS_WORKER_REVISION')].digest | [0]" -o tsv | grep -qx "$OPERATIONS_WORKER_DIGEST"
          expected_image="$PRODUCTION_ACR.azurecr.io/$IMAGE_REPOSITORY@$OPERATIONS_WORKER_DIGEST"
          job_before=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$OPERATIONS_JOB" -o json)
          jq -e --arg image "$expected_image" --arg provenance "$OPERATIONS_WORKER_REVISION" --arg identity "$OPERATIONS_WORKER_IDENTITY" --arg registry "$PRODUCTION_ACR.azurecr.io" '
            .identity.type == "UserAssigned" and
            (.identity.userAssignedIdentities | keys == [$identity]) and
            .properties.configuration.triggerType == "Event" and
            .properties.configuration.replicaTimeout == 300 and
            .properties.configuration.replicaRetryLimit == 0 and
            .properties.configuration.eventTriggerConfig.scale.minExecutions == 0 and
            .properties.configuration.eventTriggerConfig.scale.maxExecutions == 1 and
            .properties.configuration.eventTriggerConfig.scale.pollingInterval == 15 and
            (.properties.configuration.registries | length) == 1 and
            ([.properties.configuration.registries[] | select(.server == $registry and .identity == $identity)] | length) == 1 and
            ([.properties.configuration.secrets[] | select(.name == "database-url" and .identity == $identity)] | length) == 1 and
            ([.properties.configuration.eventTriggerConfig.scale.rules[] | select(.type == "azure-servicebus" and .identity == $identity)] | length) == 1 and
            (.properties.template.containers | length == 1) and
            .properties.template.containers[0].name == "production-operation" and
            .properties.template.containers[0].image == $image and
            .properties.template.containers[0].command == ["python", "-m", "scripts.production_operation_worker"] and
            ([.properties.template.containers[0].env[] | select(.name == "DATABASE_URL" and .secretRef == "database-url")] | length) == 1 and
            ([.properties.template.containers[0].env[] | select(.name == "PCIP_OPERATIONS_WORKER_PROVENANCE" and .value == $provenance)] | length) == 1 and
            .properties.template.containers[0].resources.cpu == 0.25 and
            .properties.template.containers[0].resources.memory == "0.5Gi"
          ' >/dev/null <<<"$job_before" || {
            echo "The enabled production-operations worker does not have the approved fixed configuration." >&2
            exit 1
          }
          # Retain the approved worker artifact: a valid historical App
          # Service digest can predate scripts.production_operation_worker.
          job_after=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$OPERATIONS_JOB" -o json)
          jq -e --arg image "$expected_image" --arg provenance "$OPERATIONS_WORKER_REVISION" --arg identity "$OPERATIONS_WORKER_IDENTITY" --arg registry "$PRODUCTION_ACR.azurecr.io" '
            .identity.type == "UserAssigned" and
            (.identity.userAssignedIdentities | keys == [$identity]) and
            .properties.configuration.triggerType == "Event" and
            .properties.configuration.replicaTimeout == 300 and
            .properties.configuration.replicaRetryLimit == 0 and
            .properties.configuration.eventTriggerConfig.scale.minExecutions == 0 and
            .properties.configuration.eventTriggerConfig.scale.maxExecutions == 1 and
            .properties.configuration.eventTriggerConfig.scale.pollingInterval == 15 and
            (.properties.configuration.registries | length) == 1 and
            ([.properties.configuration.registries[] | select(.server == $registry and .identity == $identity)] | length) == 1 and
            ([.properties.configuration.secrets[] | select(.name == "database-url" and .identity == $identity)] | length) == 1 and
            ([.properties.configuration.eventTriggerConfig.scale.rules[] | select(.type == "azure-servicebus" and .identity == $identity)] | length) == 1 and
            (.properties.template.containers | length == 1) and
            .properties.template.containers[0].name == "production-operation" and
            .properties.template.containers[0].image == $image and
            .properties.template.containers[0].command == ["python", "-m", "scripts.production_operation_worker"] and
            ([.properties.template.containers[0].env[] | select(.name == "DATABASE_URL" and .secretRef == "database-url")] | length) == 1 and
            ([.properties.template.containers[0].env[] | select(.name == "PCIP_OPERATIONS_WORKER_PROVENANCE" and .value == $provenance)] | length) == 1 and
            .properties.template.containers[0].resources.cpu == 0.25 and
            .properties.template.containers[0].resources.memory == "0.5Gi"
          ' >/dev/null <<<"$job_after" || {
            echo "Production-operations worker configuration did not match the approved immutable worker artifact." >&2
            exit 1
          }
      - name: Verify rollback readiness
        shell: bash
        run: |
          set -euo pipefail
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query defaultHostName -o tsv)
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "https://$host/health/ready" | grep -q '"status":"ready"'; then exit 0; fi
            sleep 10
          done
          exit 1
