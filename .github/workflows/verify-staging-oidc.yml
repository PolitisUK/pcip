name: Verify PCIP staging OIDC claims

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Emit selected non-secret OIDC claims
        shell: bash
        run: |
          set -euo pipefail
          response=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange")
          token=$(printf '%s' "$response" | jq -r '.value')
          python - "$token" <<'PY'
          import base64
          import json
          import sys

          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          selected = {
              key: claims.get(key)
              for key in ('iss', 'aud', 'sub', 'repository', 'environment')
          }
          print(json.dumps(selected, sort_keys=True))
          PY
