name: Run approved PCIP production operation

on:
  workflow_dispatch:
    inputs:
      operation:
        description: The single approved production operation.
        required: true
        type: choice
        options:
          - lookup-user-identity
      email:
        description: Exact email for the approved read-only lookup. It is masked and never added to summaries.
        required: true
        type: string
      release_sha:
        description: Full SHA reported by the currently deployed production readiness endpoint.
        required: true
        type: string
      production_image_digest:
        description: Immutable digest configured on the currently deployed production App Service.
        required: true
        type: string
      operation_operator:
        description: Named operator authorised for this approved operation.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  run-approved-operation:
    runs-on: ubuntu-latest
    environment: production
    # Acquired before validation, so a queued request revalidates the actual
    # production state after a release or rollback has finished.
    concurrency:
      group: pcip-production-control
      cancel-in-progress: false
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      PRODUCTION_APP: ${{ vars.PCIP_PRODUCTION_APP }}
      PRODUCTION_ACR: ${{ vars.PCIP_PRODUCTION_ACR }}
      OPERATIONS_AZURE_CLIENT_ID: ${{ vars.AZURE_PRODUCTION_OPERATIONS_CLIENT_ID }}
      OPERATIONS_JOB: ${{ vars.PCIP_PRODUCTION_OPERATIONS_JOB }}
      OPERATIONS_WORKER_IDENTITY: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_IDENTITY }}
      OPERATIONS_SERVICEBUS_NAMESPACE: ${{ vars.PCIP_PRODUCTION_OPERATIONS_SERVICEBUS_NAMESPACE }}
      OPERATIONS_QUEUE: ${{ vars.PCIP_PRODUCTION_OPERATIONS_QUEUE }}
      OPERATIONS_LOG_WORKSPACE: ${{ vars.PCIP_PRODUCTION_OPERATIONS_LOG_WORKSPACE }}
      OPERATIONS_WORKER_DIGEST: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_DIGEST }}
      OPERATIONS_WORKER_REVISION: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_REVISION }}
      OPERATION: ${{ inputs.operation }}
      OPERATION_EMAIL: ${{ inputs.email }}
      RELEASE_SHA: ${{ inputs.release_sha }}
      PRODUCTION_IMAGE_DIGEST: ${{ inputs.production_image_digest }}
      OPERATION_OPERATOR: ${{ inputs.operation_operator }}
      IMAGE_REPOSITORY: pcip
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PRODUCTION_OPERATIONS_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate the fixed operation and deployed release evidence
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Production operations must be dispatched from main." >&2; exit 1; }
          for value in AZURE_RESOURCE_GROUP PRODUCTION_APP PRODUCTION_ACR OPERATIONS_AZURE_CLIENT_ID OPERATIONS_JOB OPERATIONS_WORKER_IDENTITY OPERATIONS_SERVICEBUS_NAMESPACE OPERATIONS_QUEUE OPERATIONS_LOG_WORKSPACE OPERATIONS_WORKER_DIGEST OPERATIONS_WORKER_REVISION RELEASE_SHA PRODUCTION_IMAGE_DIGEST OPERATION_OPERATOR; do
            test -n "${!value}" || { echo "$value is required." >&2; exit 1; }
          done
          test "$OPERATION" = "lookup-user-identity" || { echo "The requested operation is not approved." >&2; exit 1; }
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full lowercase commit SHA." >&2; exit 1; }
          [[ "$PRODUCTION_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "production_image_digest must be immutable." >&2; exit 1; }
          [[ "$OPERATIONS_WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "operations worker digest must be immutable." >&2; exit 1; }
          [[ "$OPERATIONS_WORKER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "operations worker provenance revision is invalid." >&2; exit 1; }
          test "${#OPERATION_EMAIL}" -le 254 || { echo "The approved operation input was rejected." >&2; exit 1; }
          [[ "$OPERATION_EMAIL" != *$'\n'* && "$OPERATION_EMAIL" != *$'\r'* && "$OPERATION_EMAIL" == *@* ]] || { echo "The approved operation input was rejected." >&2; exit 1; }
          echo "::add-mask::$OPERATION_EMAIL"
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || { echo "The target release must be merged into main." >&2; exit 1; }
          az acr manifest show-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY@$PRODUCTION_IMAGE_DIGEST" --query digest -o tsv | grep -qx "$PRODUCTION_IMAGE_DIGEST"
          az acr manifest show-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY@$OPERATIONS_WORKER_DIGEST" --query digest -o tsv | grep -qx "$OPERATIONS_WORKER_DIGEST"
          az acr manifest list-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY" --query "[?digest=='$OPERATIONS_WORKER_DIGEST' && tags && contains(tags, 'operations-worker-sha-$OPERATIONS_WORKER_REVISION')].digest | [0]" -o tsv | grep -qx "$OPERATIONS_WORKER_DIGEST"
          configured_image=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query siteConfig.linuxFxVersion -o tsv)
          expected_image="DOCKER|$PRODUCTION_ACR.azurecr.io/$IMAGE_REPOSITORY@$PRODUCTION_IMAGE_DIGEST"
          test "$configured_image" = "$expected_image" || { echo "Production is not configured for the supplied immutable image." >&2; exit 1; }
          job=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$OPERATIONS_JOB" -o json)
          jq -e --arg image "$PRODUCTION_ACR.azurecr.io/$IMAGE_REPOSITORY@$OPERATIONS_WORKER_DIGEST" --arg provenance "$OPERATIONS_WORKER_REVISION" --arg identity "$OPERATIONS_WORKER_IDENTITY" --arg registry "$PRODUCTION_ACR.azurecr.io" '
            def same_resource_id($expected):
              (type == "string") and (ascii_downcase == ($expected | ascii_downcase));
            .identity.type == "UserAssigned" and
            ((.identity.userAssignedIdentities | keys | map(ascii_downcase)) == [($identity | ascii_downcase)]) and
            .properties.configuration.triggerType == "Event" and
            (.properties.configuration.registries | length) == 1 and
            ([.properties.configuration.registries[] | select(.server == $registry and (.identity | same_resource_id($identity)))] | length) == 1 and
            ([.properties.configuration.secrets[] | select(.name == "database-url" and (.identity | same_resource_id($identity)))] | length) == 1 and
            (.properties.template.containers | length == 1) and
            .properties.template.containers[0].name == "production-operation" and
            .properties.template.containers[0].image == $image and
            .properties.template.containers[0].command == ["python", "-m", "scripts.production_operation_worker"] and
            ([.properties.template.containers[0].env[] | select(.name == "DATABASE_URL" and .secretRef == "database-url")] | length) == 1 and
            ([.properties.template.containers[0].env[] | select(.name == "PCIP_OPERATIONS_WORKER_PROVENANCE" and .value == $provenance)] | length) == 1 and
            ([.properties.configuration.eventTriggerConfig.scale.rules[] | select(.type == "azure-servicebus" and (.identity | same_resource_id($identity)))] | length) == 1
          ' >/dev/null <<<"$job"
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query defaultHostName -o tsv)
          consecutive_ready=0
          for attempt in {1..12}; do
            response=""
            if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://$host/health/ready"); then :; fi
            if jq -e --arg revision "$RELEASE_SHA" '.status == "ready" and .revision == $revision' >/dev/null <<<"$response"; then
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then break; fi
            else
              consecutive_ready=0
            fi
            sleep 10
          done
          test "$consecutive_ready" -ge 3 || { echo "Production did not demonstrate sustained readiness for the supplied release." >&2; exit 1; }
      - name: Enqueue the fixed read-only operation
        id: operation
        shell: bash
        run: |
          set -euo pipefail
          correlation_id=$(uuidgen | tr '[:upper:]' '[:lower:]')
          request_file=$(mktemp)
          trap 'rm -f "$request_file"' EXIT
          jq -cn --arg correlation_id "$correlation_id" --arg operation "$OPERATION" --arg email "$OPERATION_EMAIL" \
            '{correlation_id: $correlation_id, operation: $operation, email: $email}' > "$request_file"
          access_token=$(az account get-access-token --resource https://servicebus.azure.net --query accessToken -o tsv)
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $access_token" \
            --header 'Content-Type: application/atom+xml;type=entry;charset=utf-8' \
            --data-binary "@$request_file" \
            "https://$OPERATIONS_SERVICEBUS_NAMESPACE/$OPERATIONS_QUEUE/messages" >/dev/null
          unset access_token OPERATION_EMAIL
          printf 'correlation_id=%s\n' "$correlation_id" >> "$GITHUB_OUTPUT"
          {
            echo "## Approved production operation"
            echo "- Workflow run: $GITHUB_RUN_ID"
            echo "- GitHub actor: $GITHUB_ACTOR"
            echo "- Named operator: $OPERATION_OPERATOR"
            echo "- Target release: \`$RELEASE_SHA\`"
            echo "- Operation: $OPERATION"
            echo "- Correlation: \`$correlation_id\`"
            echo "- Request: queued"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retrieve the approved non-sensitive result
        shell: bash
        env:
          CORRELATION_ID: ${{ steps.operation.outputs.correlation_id }}
        run: |
          set -euo pipefail
          query="ContainerAppConsoleLogs_CL | where Log_s has '$CORRELATION_ID' | order by TimeGenerated asc | project Log_s"
          for attempt in {1..30}; do
            # An empty successful response is expected while logs propagate.
            # A query failure must fail this protected operation explicitly.
            logs=$(az monitor log-analytics query --workspace "$OPERATIONS_LOG_WORKSPACE" --analytics-query "$query" --query '[].Log_s' -o json)
            result=$(jq -r '.[]? | select(test("\\{.*\\}$")) | capture("(?<result>\\{.*\\}$").result' <<<"$logs" | tail -n 1)
            if jq -e --arg correlation "$CORRELATION_ID" '
              .correlation_id == $correlation and
              .status == "succeeded" and
              (.result | type == "object") and
              (.result | (keys | sort) == ["active", "is_platform_admin", "memberships", "user_id"]) and
              (.result.user_id | type == "number") and
              (.result.active | type == "boolean") and
              (.result.is_platform_admin | type == "boolean") and
              (.result.memberships | type == "array") and
              all(.result.memberships[]; (keys | sort) == ["is_active", "organisation_id", "role"] and (.organisation_id | type == "number") and (.role | type == "string") and (.is_active | type == "boolean"))
            ' >/dev/null <<<"$result"; then
              jq -c '.result' <<<"$result"
              echo "- Result: succeeded" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "The approved operation did not return an approved result." >&2
          exit 1
