name: Promote PCIP release candidate

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full commit SHA already merged into main.
        required: true
        type: string
      release_operator:
        description: Named release operator.
        required: true
        type: string
      release_window:
        description: Approved release window, including timezone.
        required: true
        type: string
      rollback_decision_owner:
        description: Named person or role authorised to decide a rollback.
        required: true
        type: string
      backup_recovery_point:
        description: Verified Azure PostgreSQL recovery-point name recorded for this release.
        required: true
        type: string
      current_alembic_revision:
        description: Revision verified by the approved production database query.
        required: true
        type: string
      rollback_digest:
        description: Immutable sha256 digest of the previously verified production rollback artifact.
        required: true
        type: string
      approved_image_digest:
        description: Optional immutable digest of an already staged candidate. When supplied, the workflow verifies and promotes it without rebuilding or redeploying staging.
        required: false
        default: ''
        type: string
      promote_to_production:
        description: Set true only after the staging job has passed in this run.
        required: true
        default: false
        type: boolean
      seed_rivermere_demo:
        description: Create and verify the exact fictional Rivermere v1.1 workspace in production after promotion.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  STAGING_APP: ${{ vars.PCIP_STAGING_APP }}
  STAGING_ACR: ${{ vars.PCIP_STAGING_ACR }}
  PRODUCTION_APP: ${{ vars.PCIP_PRODUCTION_APP }}
  PRODUCTION_ACR: ${{ vars.PCIP_PRODUCTION_ACR }}
  PRODUCTION_DATABASE_SERVER: ${{ vars.PCIP_PRODUCTION_DATABASE_SERVER }}
  IMAGE_REPOSITORY: pcip

jobs:
  validate-release-evidence:
    runs-on: ubuntu-latest
    environment: release-controls
    outputs:
      release_sha: ${{ steps.evidence.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - id: evidence
        name: Validate the approved source and release record
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_OPERATOR: ${{ inputs.release_operator }}
          RELEASE_WINDOW: ${{ inputs.release_window }}
          ROLLBACK_DECISION_OWNER: ${{ inputs.rollback_decision_owner }}
          BACKUP_RECOVERY_POINT: ${{ inputs.backup_recovery_point }}
          CURRENT_ALEMBIC_REVISION: ${{ inputs.current_alembic_revision }}
          APPROVED_IMAGE_DIGEST: ${{ inputs.approved_image_digest }}
          PROMOTE_TO_PRODUCTION: ${{ inputs.promote_to_production }}
          SEED_RIVERMERE_DEMO: ${{ inputs.seed_rivermere_demo }}
        run: |
          set -euo pipefail
          for value in RELEASE_SHA RELEASE_OPERATOR RELEASE_WINDOW ROLLBACK_DECISION_OWNER BACKUP_RECOVERY_POINT CURRENT_ALEMBIC_REVISION; do
            test -n "${!value}" || { echo "$value is required." >&2; exit 1; }
          done
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_sha must be a full lowercase commit SHA." >&2; exit 1; }
          if test -n "$APPROVED_IMAGE_DIGEST"; then
            [[ "$APPROVED_IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "approved_image_digest must be an immutable sha256 digest." >&2; exit 1; }
          fi
          if [ "$SEED_RIVERMERE_DEMO" = "true" ] && [ "$PROMOTE_TO_PRODUCTION" != "true" ]; then
            echo "The production Rivermere import requires promote_to_production=true." >&2
            exit 1
          fi
          git cat-file -e "${RELEASE_SHA}^{commit}"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main || {
            echo "The release commit must already be merged into main." >&2
            exit 1
          }
          printf 'release_sha=%s\n' "$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          {
            echo "## Release evidence"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Operator: $RELEASE_OPERATOR"
            echo "- Window: $RELEASE_WINDOW"
            echo "- Rollback decision owner: $ROLLBACK_DECISION_OWNER"
            echo "- Recorded database revision: $CURRENT_ALEMBIC_REVISION"
            echo "- Recovery point: $BACKUP_RECOVERY_POINT"
          } >> "$GITHUB_STEP_SUMMARY"

  stage:
    needs: validate-release-evidence
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: pcip-staging-release
      cancel-in-progress: false
    outputs:
      image_digest: ${{ steps.digest.outputs.image_digest }}
      source_acr: ${{ steps.source.outputs.source_acr }}
      source_login_server: ${{ steps.source.outputs.source_login_server }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-evidence.outputs.release_sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Validate staging configuration
        shell: bash
        run: |
          set -euo pipefail
          for value in AZURE_RESOURCE_GROUP STAGING_APP STAGING_ACR; do
            test -n "${!value}" || { echo "Repository variable $value must be configured." >&2; exit 1; }
          done
          az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$STAGING_APP" --query state -o tsv | grep -qx Running
      - name: Resolve the staged artifact registry
        id: source
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STAGING_ACR" || { echo "Staging ACR name must be configured." >&2; exit 1; }
          source_login_server=$(az acr show -n "$STAGING_ACR" --query loginServer -o tsv)
          test -n "$source_login_server" || { echo "Staging ACR login server could not be resolved." >&2; exit 1; }
          [[ "$source_login_server" =~ ^[a-z0-9]+\.azurecr\.io$ ]] || {
            echo "Staging ACR login server has an unexpected format." >&2
            exit 1
          }
          printf 'source_acr=%s\n' "$STAGING_ACR" >> "$GITHUB_OUTPUT"
          printf 'source_login_server=%s\n' "$source_login_server" >> "$GITHUB_OUTPUT"
          {
            echo "## Staged artifact registry"
            echo "- Source ACR: \`$STAGING_ACR\`"
            echo "- Source login server: \`$source_login_server\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build an immutable candidate in the staging registry
        if: ${{ inputs.approved_image_digest == '' }}
        id: build
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.validate-release-evidence.outputs.release_sha }}
        run: |
          set -euo pipefail
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          az acr build \
            --registry "$STAGING_ACR" \
            --image "$IMAGE_REPOSITORY:sha-$RELEASE_SHA" \
            --build-arg "VCS_REF=$RELEASE_SHA" \
            --build-arg "BUILD_CREATED=$created" \
            .
      - name: Resolve the immutable candidate digest
        id: digest
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.validate-release-evidence.outputs.release_sha }}
          APPROVED_IMAGE_DIGEST: ${{ inputs.approved_image_digest }}
        run: |
          set -euo pipefail
          if test -n "$APPROVED_IMAGE_DIGEST"; then
            az acr manifest show-metadata -r "$STAGING_ACR" -n "$IMAGE_REPOSITORY@$APPROVED_IMAGE_DIGEST" --query digest -o tsv | grep -qx "$APPROVED_IMAGE_DIGEST"
            az acr manifest list-metadata -r "$STAGING_ACR" -n "$IMAGE_REPOSITORY" --query "[?digest=='$APPROVED_IMAGE_DIGEST' && tags && contains(tags, 'sha-$RELEASE_SHA')].digest | [0]" -o tsv | grep -qx "$APPROVED_IMAGE_DIGEST"
            digest="$APPROVED_IMAGE_DIGEST"
          else
            digest=$(az acr manifest list-metadata -r "$STAGING_ACR" -n "$IMAGE_REPOSITORY" --query "[?tags && contains(tags, 'sha-$RELEASE_SHA')].digest | [0]" -o tsv)
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Could not resolve a candidate image digest." >&2; exit 1; }
          printf 'image_digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          echo "Staging candidate: ${{ steps.source.outputs.source_login_server }}/$IMAGE_REPOSITORY@$digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Generate staging startup generations
        id: startup_generations
        shell: bash
        run: |
          set -euo pipefail
          candidate_generation=$(uuidgen | tr '[:upper:]' '[:lower:]')
          final_generation=$(uuidgen | tr '[:upper:]' '[:lower:]')
          test "$candidate_generation" != "$final_generation"
          printf 'candidate_generation=%s\n' "$candidate_generation" >> "$GITHUB_OUTPUT"
          printf 'final_generation=%s\n' "$final_generation" >> "$GITHUB_OUTPUT"
      - name: Deploy the digest-pinned candidate to staging
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
          CANDIDATE_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.candidate_generation }}
        run: |
          set -euo pipefail
          az webapp config appsettings set -g "$AZURE_RESOURCE_GROUP" -n "$STAGING_APP" \
            --settings RUN_MIGRATIONS=true RELEASE_STARTUP_GENERATION="$CANDIDATE_STARTUP_GENERATION" >/dev/null
          az webapp config set -g "$AZURE_RESOURCE_GROUP" -n "$STAGING_APP" --linux-fx-version "DOCKER|${{ steps.source.outputs.source_login_server }}/$IMAGE_REPOSITORY@$IMAGE_DIGEST" >/dev/null
          az webapp restart -g "$AZURE_RESOURCE_GROUP" -n "$STAGING_APP"
      - name: Verify the restarted staged candidate and public legal routes
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
          EXPECTED_REVISION: ${{ needs.validate-release-evidence.outputs.release_sha }}
          EXPECTED_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.candidate_generation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected release revision is invalid." >&2; exit 1; }
          [[ "$EXPECTED_STARTUP_GENERATION" =~ ^[0-9a-f-]{36}$ ]] || { echo "Expected staging startup generation is invalid." >&2; exit 1; }
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$STAGING_APP" --query defaultHostName -o tsv)
          configured_image=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$STAGING_APP" --query siteConfig.linuxFxVersion -o tsv)
          expected_image="DOCKER|${{ steps.source.outputs.source_login_server }}/$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          test "$configured_image" = "$expected_image" || { echo "Staging is not configured for the candidate digest." >&2; exit 1; }
          consecutive_ready=0
          for attempt in {1..60}; do
            response=""
            if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://$host/health/ready"); then :; fi
            if jq -e --arg expected_revision "$EXPECTED_REVISION" --arg expected_generation "$EXPECTED_STARTUP_GENERATION" \
              '.status == "ready" and .revision == $expected_revision and .startup_generation == $expected_generation' >/dev/null <<<"$response"; then
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                break
              fi
            else
              consecutive_ready=0
            fi
            sleep 10
          done
          test "$consecutive_ready" -ge 3 || {
            echo "Staging did not reach sustained readiness for the migration-armed startup generation." >&2
            exit 1
          }
          for route in privacy support terms cookies accessibility acceptable-use legal contact; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://$host/$route" >/dev/null
          done
      - name: Disable automatic migrations after staging validation
        if: always()
        shell: bash
        env:
          FINAL_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.final_generation }}
        run: |
          set -euo pipefail
          # Keep the non-sensitive final generation configured so readiness
          # proves a process started after migration cleanup. Every attempt
          # generates fresh values above.
          az webapp config appsettings set -g "$AZURE_RESOURCE_GROUP" -n "$STAGING_APP" \
            --settings RUN_MIGRATIONS=false RELEASE_STARTUP_GENERATION="$FINAL_STARTUP_GENERATION" >/dev/null
      - name: Verify staging steady state after migrations are disabled
        if: ${{ success() }}
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.digest.outputs.image_digest }}
          EXPECTED_REVISION: ${{ needs.validate-release-evidence.outputs.release_sha }}
          EXPECTED_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.final_generation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected release revision is invalid." >&2; exit 1; }
          [[ "$EXPECTED_STARTUP_GENERATION" =~ ^[0-9a-f-]{36}$ ]] || { echo "Expected staging startup generation is invalid." >&2; exit 1; }
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$STAGING_APP" --query defaultHostName -o tsv)
          consecutive_ready=0
          for attempt in {1..60}; do
            response=""
            if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://$host/health/ready"); then :; fi
            if jq -e --arg expected_revision "$EXPECTED_REVISION" --arg expected_generation "$EXPECTED_STARTUP_GENERATION" \
              '.status == "ready" and .revision == $expected_revision and .startup_generation == $expected_generation' >/dev/null <<<"$response"; then
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                break
              fi
            else
              consecutive_ready=0
            fi
            sleep 10
          done
          test "$consecutive_ready" -ge 3 || {
            echo "Staging did not reach the final startup generation after migrations were disabled." >&2
            exit 1
          }

  promote-production:
    if: ${{ inputs.promote_to_production }}
    needs: [validate-release-evidence, stage]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: pcip-production-control
      cancel-in-progress: false
    env:
      SOURCE_ACR: ${{ needs.stage.outputs.source_acr }}
      SOURCE_LOGIN_SERVER: ${{ needs.stage.outputs.source_login_server }}
      # This protected-environment variable remains false until the isolated
      # event-driven operations infrastructure has been provisioned.  Once it
      # is true, every successful production image transition must verify the
      # independently approved worker; a missing or stale worker is a release failure.
      PRODUCTION_OPERATIONS_ENABLED: ${{ vars.PCIP_PRODUCTION_OPERATIONS_ENABLED }}
      OPERATIONS_JOB: ${{ vars.PCIP_PRODUCTION_OPERATIONS_JOB }}
      OPERATIONS_WORKER_IDENTITY: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_IDENTITY }}
      OPERATIONS_WORKER_DIGEST: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_DIGEST }}
      OPERATIONS_WORKER_REVISION: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_REVISION }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release-evidence.outputs.release_sha }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Generate production startup generations
        id: startup_generations
        shell: bash
        run: |
          set -euo pipefail
          candidate_generation=$(uuidgen | tr '[:upper:]' '[:lower:]')
          final_generation=$(uuidgen | tr '[:upper:]' '[:lower:]')
          test "$candidate_generation" != "$final_generation"
          printf 'candidate_generation=%s\n' "$candidate_generation" >> "$GITHUB_OUTPUT"
          printf 'final_generation=%s\n' "$final_generation" >> "$GITHUB_OUTPUT"
      - name: Enforce the no-migration production steady state
        shell: bash
        run: |
          set -euo pipefail
          # A normal restart must never discover a stale true setting and run
          # schema changes outside this explicitly approved promotion job.
          az webapp config appsettings set -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" \
            --settings RUN_MIGRATIONS=false RUN_RIVERMERE_PRODUCTION_DEMO_SEED=false >/dev/null
          az webapp config appsettings delete -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" \
            --setting-names RIVERMERE_DEMO_OWNER_USER_ID RIVERMERE_DEMO_OWNER_EMAIL RIVERMERE_DEMO_VERIFICATION_NOT_BEFORE >/dev/null
      - name: Verify production evidence and rollback target
        shell: bash
        env:
          BACKUP_RECOVERY_POINT: ${{ inputs.backup_recovery_point }}
          CURRENT_ALEMBIC_REVISION: ${{ inputs.current_alembic_revision }}
          ROLLBACK_DIGEST: ${{ inputs.rollback_digest }}
          IMAGE_DIGEST: ${{ needs.stage.outputs.image_digest }}
        run: |
          set -euo pipefail
          for value in AZURE_RESOURCE_GROUP PRODUCTION_APP PRODUCTION_ACR PRODUCTION_DATABASE_SERVER SOURCE_ACR SOURCE_LOGIN_SERVER IMAGE_DIGEST; do
            test -n "${!value}" || { echo "Repository variable $value must be configured." >&2; exit 1; }
          done
          [[ "$SOURCE_ACR" =~ ^[a-z0-9]+$ ]] || { echo "Source ACR name has an unexpected format." >&2; exit 1; }
          [[ "$SOURCE_LOGIN_SERVER" =~ ^[a-z0-9]+\.azurecr\.io$ ]] || { echo "Source ACR login server has an unexpected format." >&2; exit 1; }
          [[ "$PRODUCTION_ACR" =~ ^[a-z0-9]+$ ]] || { echo "Destination ACR name has an unexpected format." >&2; exit 1; }
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Candidate digest must be an immutable sha256 digest." >&2; exit 1; }
          expected_source_login_server=$(az acr show -n "$SOURCE_ACR" --query loginServer -o tsv)
          test -n "$expected_source_login_server" || { echo "Source ACR login server could not be verified." >&2; exit 1; }
          test "$SOURCE_LOGIN_SERVER" = "$expected_source_login_server" || {
            echo "Source ACR login server does not match the resolved registry." >&2
            exit 1
          }
          az acr manifest show-metadata -r "$SOURCE_ACR" -n "$IMAGE_REPOSITORY@$IMAGE_DIGEST" --query digest -o tsv | grep -qx "$IMAGE_DIGEST"
          az postgres flexible-server backup list -g "$AZURE_RESOURCE_GROUP" -s "$PRODUCTION_DATABASE_SERVER" --query "[?name=='$BACKUP_RECOVERY_POINT'].name | [0]" -o tsv | grep -qx "$BACKUP_RECOVERY_POINT"
          [[ "$CURRENT_ALEMBIC_REVISION" =~ ^[0-9]{4}$ ]] || { echo "Current Alembic revision must come from the approved production query." >&2; exit 1; }
          [[ "$ROLLBACK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "A verified rollback digest is required." >&2; exit 1; }
          az acr manifest show-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY@$ROLLBACK_DIGEST" --query digest -o tsv | grep -qx "$ROLLBACK_DIGEST"
      - name: Promote the already-staged immutable artifact and run the one approved migration
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.validate-release-evidence.outputs.release_sha }}
          IMAGE_DIGEST: ${{ needs.stage.outputs.image_digest }}
          CANDIDATE_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.candidate_generation }}
        run: |
          set -euo pipefail
          az acr import -n "$PRODUCTION_ACR" --source "$SOURCE_LOGIN_SERVER/$IMAGE_REPOSITORY@$IMAGE_DIGEST" --image "$IMAGE_REPOSITORY:sha-$RELEASE_SHA"
          promoted=$(az acr manifest list-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY" --query "[?tags && contains(tags, 'sha-$RELEASE_SHA')].digest | [0]" -o tsv)
          test "$promoted" = "$IMAGE_DIGEST" || { echo "Imported production digest differs from staged artifact." >&2; exit 1; }
          # This is the only point at which the production workflow arms a
          # schema upgrade.  The always() cleanup below restores false even
          # when deployment or readiness verification fails.
          az webapp config appsettings set -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" \
            --settings RUN_MIGRATIONS=true RELEASE_STARTUP_GENERATION="$CANDIDATE_STARTUP_GENERATION" >/dev/null
          az webapp config set -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --linux-fx-version "DOCKER|$PRODUCTION_ACR.azurecr.io/$IMAGE_REPOSITORY@$IMAGE_DIGEST" >/dev/null
          az webapp restart -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP"
      - name: Verify the restarted production candidate and public legal routes
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.stage.outputs.image_digest }}
          EXPECTED_REVISION: ${{ needs.validate-release-evidence.outputs.release_sha }}
          EXPECTED_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.candidate_generation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected release revision is invalid." >&2; exit 1; }
          [[ "$EXPECTED_STARTUP_GENERATION" =~ ^[0-9a-f-]{36}$ ]] || { echo "Expected production startup generation is invalid." >&2; exit 1; }
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query defaultHostName -o tsv)
          configured_image=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query siteConfig.linuxFxVersion -o tsv)
          expected_image="DOCKER|$PRODUCTION_ACR.azurecr.io/$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          test "$configured_image" = "$expected_image" || {
            echo "Production is not configured for the promoted candidate digest." >&2
            exit 1
          }
          consecutive_ready=0
          for attempt in {1..60}; do
            response=""
            if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://$host/health/ready"); then :; fi
            if jq -e --arg expected_revision "$EXPECTED_REVISION" --arg expected_generation "$EXPECTED_STARTUP_GENERATION" \
              '.status == "ready" and .revision == $expected_revision and .startup_generation == $expected_generation' >/dev/null <<<"$response"; then
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                break
              fi
            else
              consecutive_ready=0
            fi
            sleep 10
          done
          test "$consecutive_ready" -ge 3 || {
            echo "Production did not reach sustained readiness after the candidate was configured." >&2
            exit 1
          }
          for route in privacy support terms cookies accessibility acceptable-use legal contact; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://citizencentric.co.uk/$route" >/dev/null
          done
      - name: Verify the independently pinned production-operations worker
        shell: bash
        env:
          OPERATIONS_WORKER_DIGEST: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_DIGEST }}
          OPERATIONS_WORKER_REVISION: ${{ vars.PCIP_PRODUCTION_OPERATIONS_WORKER_REVISION }}
        run: |
          set -euo pipefail
          case "${PRODUCTION_OPERATIONS_ENABLED:-false}" in
            ''|false)
              echo "Production operations infrastructure is disabled; worker artifact verification skipped."
              exit 0
              ;;
            true)
              ;;
            *)
              echo "PCIP_PRODUCTION_OPERATIONS_ENABLED must be true or false." >&2
              exit 1
              ;;
          esac
          for value in AZURE_RESOURCE_GROUP PRODUCTION_ACR OPERATIONS_JOB OPERATIONS_WORKER_IDENTITY OPERATIONS_WORKER_DIGEST OPERATIONS_WORKER_REVISION; do
            test -n "${!value}" || { echo "$value is required when production operations are enabled." >&2; exit 1; }
          done
          [[ "$OPERATIONS_WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Operations worker image must be an immutable sha256 digest." >&2; exit 1; }
          [[ "$OPERATIONS_WORKER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Operations worker provenance revision is invalid." >&2; exit 1; }
          az acr manifest show-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY@$OPERATIONS_WORKER_DIGEST" --query digest -o tsv | grep -qx "$OPERATIONS_WORKER_DIGEST"
          az acr manifest list-metadata -r "$PRODUCTION_ACR" -n "$IMAGE_REPOSITORY" --query "[?digest=='$OPERATIONS_WORKER_DIGEST' && tags && contains(tags, 'sha-$OPERATIONS_WORKER_REVISION')].digest | [0]" -o tsv | grep -qx "$OPERATIONS_WORKER_DIGEST"
          expected_image="$PRODUCTION_ACR.azurecr.io/$IMAGE_REPOSITORY@$OPERATIONS_WORKER_DIGEST"
          job_before=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$OPERATIONS_JOB" -o json)
          jq -e --arg image "$expected_image" --arg provenance "$OPERATIONS_WORKER_REVISION" --arg identity "$OPERATIONS_WORKER_IDENTITY" --arg registry "$PRODUCTION_ACR.azurecr.io" '
            def same_resource_id($expected):
              (type == "string") and (ascii_downcase == ($expected | ascii_downcase));
            .identity.type == "UserAssigned" and
            ((.identity.userAssignedIdentities | keys | map(ascii_downcase)) == [($identity | ascii_downcase)]) and
            .properties.configuration.triggerType == "Event" and
            .properties.configuration.replicaTimeout == 300 and
            .properties.configuration.replicaRetryLimit == 0 and
            .properties.configuration.eventTriggerConfig.scale.minExecutions == 0 and
            .properties.configuration.eventTriggerConfig.scale.maxExecutions == 1 and
            .properties.configuration.eventTriggerConfig.scale.pollingInterval == 15 and
            (.properties.configuration.registries | length) == 1 and
            ([.properties.configuration.registries[] | select(.server == $registry and (.identity | same_resource_id($identity)))] | length) == 1 and
            ([.properties.configuration.secrets[] | select(.name == "database-url" and (.identity | same_resource_id($identity)))] | length) == 1 and
            ([.properties.configuration.eventTriggerConfig.scale.rules[] | select(.type == "azure-servicebus" and (.identity | same_resource_id($identity)))] | length) == 1 and
            (.properties.template.containers | length == 1) and
            .properties.template.containers[0].name == "production-operation" and
            .properties.template.containers[0].image == $image and
            .properties.template.containers[0].command == ["python", "-m", "scripts.production_operation_worker"] and
            ([.properties.template.containers[0].env[] | select(.name == "DATABASE_URL" and .secretRef == "database-url")] | length) == 1 and
            ([.properties.template.containers[0].env[] | select(.name == "PCIP_OPERATIONS_WORKER_PROVENANCE" and .value == $provenance)] | length) == 1 and
            .properties.template.containers[0].resources.cpu == 0.25 and
            .properties.template.containers[0].resources.memory == "0.5Gi"
          ' >/dev/null <<<"$job_before" || {
            echo "The enabled production-operations worker does not have the approved fixed configuration." >&2
            exit 1
          }
          # Application promotion never replaces the worker with its own
          # digest: a historical application rollback may predate the worker.
          job_after=$(az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$OPERATIONS_JOB" -o json)
          jq -e --arg image "$expected_image" --arg provenance "$OPERATIONS_WORKER_REVISION" --arg identity "$OPERATIONS_WORKER_IDENTITY" --arg registry "$PRODUCTION_ACR.azurecr.io" '
            def same_resource_id($expected):
              (type == "string") and (ascii_downcase == ($expected | ascii_downcase));
            .identity.type == "UserAssigned" and
            ((.identity.userAssignedIdentities | keys | map(ascii_downcase)) == [($identity | ascii_downcase)]) and
            .properties.configuration.triggerType == "Event" and
            .properties.configuration.replicaTimeout == 300 and
            .properties.configuration.replicaRetryLimit == 0 and
            .properties.configuration.eventTriggerConfig.scale.minExecutions == 0 and
            .properties.configuration.eventTriggerConfig.scale.maxExecutions == 1 and
            .properties.configuration.eventTriggerConfig.scale.pollingInterval == 15 and
            (.properties.configuration.registries | length) == 1 and
            ([.properties.configuration.registries[] | select(.server == $registry and (.identity | same_resource_id($identity)))] | length) == 1 and
            ([.properties.configuration.secrets[] | select(.name == "database-url" and (.identity | same_resource_id($identity)))] | length) == 1 and
            ([.properties.configuration.eventTriggerConfig.scale.rules[] | select(.type == "azure-servicebus" and (.identity | same_resource_id($identity)))] | length) == 1 and
            (.properties.template.containers | length == 1) and
            .properties.template.containers[0].name == "production-operation" and
            .properties.template.containers[0].image == $image and
            .properties.template.containers[0].command == ["python", "-m", "scripts.production_operation_worker"] and
            ([.properties.template.containers[0].env[] | select(.name == "DATABASE_URL" and .secretRef == "database-url")] | length) == 1 and
            ([.properties.template.containers[0].env[] | select(.name == "PCIP_OPERATIONS_WORKER_PROVENANCE" and .value == $provenance)] | length) == 1 and
            .properties.template.containers[0].resources.cpu == 0.25 and
            .properties.template.containers[0].resources.memory == "0.5Gi"
          ' >/dev/null <<<"$job_after" || {
            echo "Production-operations worker configuration did not match the approved immutable worker artifact." >&2
            exit 1
          }
      - name: Enable the approved production Rivermere startup runner
        if: ${{ inputs.seed_rivermere_demo }}
        id: rivermere_seed_control
        shell: bash
        env:
          RIVERMERE_DEMO_OWNER_USER_ID: ${{ secrets.RIVERMERE_DEMO_OWNER_USER_ID }}
          RIVERMERE_DEMO_OWNER_EMAIL: ${{ secrets.RIVERMERE_DEMO_OWNER_EMAIL }}
        run: |
          set -euo pipefail
          if { test -z "$RIVERMERE_DEMO_OWNER_USER_ID" && test -z "$RIVERMERE_DEMO_OWNER_EMAIL"; } || \
             { test -n "$RIVERMERE_DEMO_OWNER_USER_ID" && test -n "$RIVERMERE_DEMO_OWNER_EMAIL"; }; then
            echo "The protected Rivermere production owner configuration is required." >&2
            exit 1
          fi
          verification_not_before=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          echo "verification_not_before=$verification_not_before" >> "$GITHUB_OUTPUT"
          # Updating App Service settings restarts the app. Do not also issue a
          # manual restart: that could invoke the one-time importer twice.
          az webapp config appsettings set \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$PRODUCTION_APP" \
            --settings RUN_RIVERMERE_PRODUCTION_DEMO_SEED=true RIVERMERE_DEMO_OWNER_USER_ID="$RIVERMERE_DEMO_OWNER_USER_ID" RIVERMERE_DEMO_OWNER_EMAIL="$RIVERMERE_DEMO_OWNER_EMAIL" RIVERMERE_DEMO_VERIFICATION_NOT_BEFORE="$verification_not_before" \
            >/dev/null
      - name: Wait for durable production Rivermere verification
        if: ${{ steps.rivermere_seed_control.outcome == 'success' }}
        shell: bash
        env:
          VERIFICATION_NOT_BEFORE: ${{ steps.rivermere_seed_control.outputs.verification_not_before }}
        run: |
          set -euo pipefail
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query defaultHostName -o tsv)
          for attempt in {1..90}; do
            response=""
            if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://$host/api/v1/rivermere/verification"); then :; fi
            if jq -e --arg not_before "$VERIFICATION_NOT_BEFORE" \
              '.dataset == "rivermere" and .content_version == "1.1.0" and .verified == true and (.verified_at >= $not_before)' \
              >/dev/null <<<"$response"; then
              exit 0
            fi
            sleep 10
          done
          echo "Production did not publish a new durable Rivermere verification record." >&2
          exit 1
      - name: Clear the production Rivermere startup runner
        if: ${{ always() && inputs.seed_rivermere_demo }}
        shell: bash
        env:
          FINAL_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.final_generation }}
        run: |
          set -euo pipefail
          # Setting the flag false restarts the app; remove the transient
          # protected selectors before the final readiness verification.
          az webapp config appsettings set \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$PRODUCTION_APP" \
            --settings RUN_MIGRATIONS=false RUN_RIVERMERE_PRODUCTION_DEMO_SEED=false RELEASE_STARTUP_GENERATION="$FINAL_STARTUP_GENERATION" \
            >/dev/null
          az webapp config appsettings delete \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$PRODUCTION_APP" \
            --setting-names RIVERMERE_DEMO_OWNER_USER_ID RIVERMERE_DEMO_OWNER_EMAIL RIVERMERE_DEMO_VERIFICATION_NOT_BEFORE \
            >/dev/null
      - name: Verify final production readiness after Rivermere cleanup
        if: ${{ always() && inputs.seed_rivermere_demo }}
        shell: bash
        env:
          EXPECTED_REVISION: ${{ needs.validate-release-evidence.outputs.release_sha }}
          EXPECTED_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.final_generation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected release revision is invalid." >&2; exit 1; }
          [[ "$EXPECTED_STARTUP_GENERATION" =~ ^[0-9a-f-]{36}$ ]] || { echo "Expected production startup generation is invalid." >&2; exit 1; }
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query defaultHostName -o tsv)
          consecutive_ready=0
          for attempt in {1..60}; do
            response=""
            if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://$host/health/ready"); then :; fi
            if jq -e --arg expected_revision "$EXPECTED_REVISION" --arg expected_generation "$EXPECTED_STARTUP_GENERATION" \
              '.status == "ready" and .revision == $expected_revision and .startup_generation == $expected_generation' >/dev/null <<<"$response"; then
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                break
              fi
            else
              consecutive_ready=0
            fi
            sleep 10
          done
          test "$consecutive_ready" -ge 3 || { echo "Production did not reach the final startup generation after the Rivermere runner was cleared." >&2; exit 1; }
          for route in privacy support terms cookies accessibility acceptable-use legal contact; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://citizencentric.co.uk/$route" >/dev/null
          done
      - name: Fail safe to the no-migration production steady state
        if: ${{ always() && inputs.seed_rivermere_demo == false }}
        shell: bash
        env:
          FINAL_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.final_generation }}
        run: |
          # Retain the non-sensitive final generation: readiness must prove
          # this safe post-cleanup process, and the next attempt rotates it.
          az webapp config appsettings set -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --settings RUN_MIGRATIONS=false RELEASE_STARTUP_GENERATION="$FINAL_STARTUP_GENERATION" >/dev/null
      - name: Verify final production steady state after migrations are disabled
        if: ${{ success() && inputs.seed_rivermere_demo == false }}
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.stage.outputs.image_digest }}
          EXPECTED_REVISION: ${{ needs.validate-release-evidence.outputs.release_sha }}
          EXPECTED_STARTUP_GENERATION: ${{ steps.startup_generations.outputs.final_generation }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected release revision is invalid." >&2; exit 1; }
          [[ "$EXPECTED_STARTUP_GENERATION" =~ ^[0-9a-f-]{36}$ ]] || { echo "Expected production startup generation is invalid." >&2; exit 1; }
          host=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query defaultHostName -o tsv)
          run_migrations=$(az webapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query "[?name=='RUN_MIGRATIONS'].value | [0]" -o tsv)
          test "$run_migrations" = false || { echo "RUN_MIGRATIONS was not restored to false." >&2; exit 1; }
          run_rivermere_seed=$(az webapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query "[?name=='RUN_RIVERMERE_PRODUCTION_DEMO_SEED'].value | [0]" -o tsv)
          test "$run_rivermere_seed" = false || { echo "RUN_RIVERMERE_PRODUCTION_DEMO_SEED was not false." >&2; exit 1; }
          for transient_setting in RIVERMERE_DEMO_OWNER_USER_ID RIVERMERE_DEMO_OWNER_EMAIL RIVERMERE_DEMO_VERIFICATION_NOT_BEFORE; do
            transient_value=$(az webapp config appsettings list -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query "[?name=='$transient_setting'].name | [0]" -o tsv)
            test -z "$transient_value" || { echo "A transient Rivermere setting remains configured." >&2; exit 1; }
          done
          configured_image=$(az webapp show -g "$AZURE_RESOURCE_GROUP" -n "$PRODUCTION_APP" --query siteConfig.linuxFxVersion -o tsv)
          expected_image="DOCKER|$PRODUCTION_ACR.azurecr.io/$IMAGE_REPOSITORY@$IMAGE_DIGEST"
          test "$configured_image" = "$expected_image" || {
            echo "Production is not configured for the promoted candidate digest." >&2
            exit 1
          }
          consecutive_ready=0
          for attempt in {1..60}; do
            response=""
            if response=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://$host/health/ready"); then :; fi
            if jq -e --arg expected_revision "$EXPECTED_REVISION" --arg expected_generation "$EXPECTED_STARTUP_GENERATION" \
              '.status == "ready" and .revision == $expected_revision and .startup_generation == $expected_generation' >/dev/null <<<"$response"; then
              consecutive_ready=$((consecutive_ready + 1))
              if [ "$consecutive_ready" -ge 3 ]; then
                break
              fi
            else
              consecutive_ready=0
            fi
            sleep 10
          done
          test "$consecutive_ready" -ge 3 || {
            echo "Production did not remain ready after migrations were disabled." >&2
            exit 1
          }
          for route in privacy support terms cookies accessibility acceptable-use legal contact; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 20 "https://citizencentric.co.uk/$route" >/dev/null
          done
