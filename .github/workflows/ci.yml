name: PCIP CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - name: Static correctness checks
        run: ruff check app tests --select F
      - name: Tests with coverage floor
        run: |
          coverage run --source=app -m pytest -q
          coverage report --fail-under=80

  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pcip
          POSTGRES_PASSWORD: pcip-ci-password
          POSTGRES_DB: pcip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcip -d pcip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://pcip:pcip-ci-password@127.0.0.1:5432/pcip
      ENVIRONMENT: test
      SEED_DEMO_DATA: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Upgrade an empty PostgreSQL database
        run: |
          alembic upgrade head
          alembic current
          alembic check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install security tooling
        run: pip install -r requirements-dev.txt
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.lock
      - name: Security linting
        run: bandit -q -r app --severity-level medium --confidence-level medium

  docker:
    runs-on: ubuntu-latest
    needs: [test, migration, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pcip:${{ github.sha }}
      - name: Verify the packaged production-operations worker boundary
        run: |
          docker run --rm --entrypoint sh pcip:${{ github.sha }} -c '
            set -e
            test -f /app/scripts/production_operation_worker.py
            test -f /app/scripts/lookup_user_identity.py
            python -c "import scripts.production_operation_worker"
            test ! -e /app/scripts/set_platform_admin.py
          '
      - name: Release image smoke check
        run: |
          docker run -d --name pcip-smoke -p 18000:8000 -e RUN_MIGRATIONS=false -e SEED_DEMO_DATA=false pcip:${{ github.sha }}
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18000/health > /tmp/pcip-health.json; then
              cat /tmp/pcip-health.json
              break
            fi
            sleep 1
          done
          grep '"status":"ok"' /tmp/pcip-health.json
      - name: Cleanup smoke container
        if: always()
        run: docker rm -f pcip-smoke || true
