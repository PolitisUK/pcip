name: PCIP CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pip check
      - run: pytest -q
      - run: alembic upgrade head

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install security tooling
        run: pip install pip-audit bandit
      - name: Dependency vulnerability scan
        run: pip-audit -r requirements.txt
      - name: Security linting
        run: bandit -q -r app --severity-level medium --confidence-level medium

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: pcip:${{ github.sha }}
      - name: Release image smoke check
        run: |
          docker run -d --name pcip-smoke -p 18000:8000 -e RUN_MIGRATIONS=false -e SEED_DEMO_DATA=false pcip:${{ github.sha }}
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18000/health > /tmp/pcip-health.json; then
              cat /tmp/pcip-health.json
              break
            fi
            sleep 1
          done
          grep '"status":"ok"' /tmp/pcip-health.json
      - name: Cleanup smoke container
        if: always()
        run: docker rm -f pcip-smoke || true
