name: Mobile CI

on:
  pull_request:
    paths:
      - "participant_app/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "participant_app/**"
      - ".github/workflows/mobile-ci.yml"

jobs:
  mobile-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: participant_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=PCIP_API_BASE_URL=https://citizencentric.co.uk
