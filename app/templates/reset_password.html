{% extends "base.html" %}{% block public %}<div class="login-wrap"><div class="login-card"><h1>Create a new password</h1>{% if valid %}<form method="post" class="stack"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="token" value="{{ token }}"><div class="field"><label>New password</label><input type="password" name="password" minlength="10" required></div><button>Save password</button></form>{% else %}<div class="error">This reset link is invalid or expired.</div>{% endif %}</div></div>{% endblock %}
