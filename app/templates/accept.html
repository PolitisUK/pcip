{% extends "base.html" %}
{% block public %}
<div class="login-wrap">
	<div class="login-card">
		<p class="eyebrow">Researcher invitation</p>
		{% if valid %}
		<h1>Activate your researcher account</h1>
		<p>You have been invited as <strong>{{ invitation.role }}</strong>.</p>
		<form method="post" action="/accept-invitation" class="stack">
			<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
			<div class="field"><label>Create password</label><input type="password" name="password" minlength="10" autocomplete="new-password" required></div>
			<button>Activate account</button>
		</form>
		{% else %}
		<h1>Invitation unavailable</h1>
		<div class="error" role="alert">This invitation is invalid, expired, accepted or revoked.</div>
		{% endif %}
	</div>
</div>
{% endblock %}
