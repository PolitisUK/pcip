{% extends "base.html" %}
{% block page_title %}{{ status_code }} · {{ app_name }}{% endblock %}
{% block public %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand public-brand">
      <img class="brand-logo" src="/static/politis_horizontal_master.png" alt="Politis logo">
      <span>Citizen Centric</span>
      <small>by Politis</small>
    </div>
    <p class="eyebrow">Error {{ status_code }}</p>
    <h1>{{ error_title }}</h1>
    <p>{{ error_detail }}</p>
    <a class="btn secondary" href="/">Return to dashboard</a>
  </div>
</div>
{% endblock %}
