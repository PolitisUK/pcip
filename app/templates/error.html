{% extends "base.html" %}
{% block page_title %}{{ status_code }} · {{ app_name }}{% endblock %}
{% block public %}
<div class="login-wrap">
  <div class="login-card">
    <div class="brand public-brand">
      <img class="brand-logo brand-logo--wordmark" src="/static/citizen-centric-logo.png" alt="Citizen Centric by Politis">
    </div>
    <p class="eyebrow">Error {{ status_code }}</p>
    <h1>{{ error_title }}</h1>
    <p role="alert">{{ error_detail }}</p>
    <a class="btn secondary" href="/">Return to Citizen Centric home</a>
  </div>
</div>
{% endblock %}
