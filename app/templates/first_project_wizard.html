{% extends "base.html" %}{% block content %}<div class="card stack"><h1>Launch your first pilot project</h1><p>Create a starter project and study so you can begin collecting evidence.</p><form method="post" action="/onboarding/first-project" class="stack"><div class="field"><label>Project title</label><input name="project_title" required></div><div class="field"><label>Project code</label><input name="project_code" required></div><div class="field"><label>Project description</label><textarea name="project_description"></textarea></div><div class="field"><label>Project status</label><select name="project_status">{% for status in project_statuses %}<option value="{{ status }}">{{ status }}</option>{% endfor %}</select></div><div class="field"><label>Study title</label><input name="study_title" required></div><div class="field"><label>Study code</label><input name="study_code" required></div><div class="field"><label>Study description</label><textarea name="study_description"></textarea></div><div class="field"><label>Study methodology</label><select name="study_methodology">{% for option in ['diary','walk_along','interview','focus_group','co_design','mixed_method'] %}<option value="{{ option }}">{{ option }}</option>{% endfor %}</select></div><div class="field"><label>Study status</label><select name="study_status">{% for status in study_statuses %}<option value="{{ status }}">{{ status }}</option>{% endfor %}</select></div><label class="check"><input type="checkbox" name="add_starter_activity" value="true" checked> Add a starter activity</label><button>Create first project</button></form></div>{% endblock %}
