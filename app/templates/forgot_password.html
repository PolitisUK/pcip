{% extends "base.html" %}
{% block public %}
<div class="login-wrap">
	<div class="login-card">
		<p class="eyebrow">Account support</p>
		<h1>Reset your password</h1>
		{% if sent %}
		<div class="notice neutral" role="status">If an active account exists, a reset link has been issued.</div>
		{% else %}
		<form method="post" class="stack">
			<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
			<div class="field"><label>Email</label><input type="email" name="email" autocomplete="email" required></div>
			<button>Send reset link</button>
		</form>
		{% endif %}
		<p><a class="text-link" href="/login">Back to sign in</a></p>
	</div>
</div>
{% endblock %}
