<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#215bb3">
  <title>Citizen Centric is offline</title>
  <style>
    :root {
      font-family: "Segoe UI", "Aptos", "Helvetica Neue", Arial, sans-serif;
      color: #15304a;
      background: #f4f7fb;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      box-sizing: border-box;
      padding: 28px;
      background: #ffffff;
      border: 1px solid #d7e0ea;
      border-radius: 14px;
    }

    h1 {
      margin-top: 0;
      color: #113d7d;
    }

    a {
      color: #215bb3;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main id="main-content">
    <h1>You’re offline</h1>
    <p>Citizen Centric could not connect securely to the server.</p>
    <p>No participant page, response, message or evidence has been made available offline.</p>
    <p>Reconnect to the internet and try again.</p>
    <p><a href="/participant-portal">Try again</a></p>
  </main>
</body>
</html>
